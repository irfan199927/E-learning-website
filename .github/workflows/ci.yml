# Quality gate for every PR, and for main via deploy.yml (which calls this before shipping, so pushes to
# main run it once, not twice). Required checks: checks, integration, e2e, docker.
# Same commands a contributor runs locally (see README "Scripts").
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  # Throwaway values for CI only: the apps validate their env, and the tests use local services.
  DATABASE_URL: postgresql://elearner:elearner@localhost:5432/elearner
  REDIS_URL: redis://localhost:6379

jobs:
  checks:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration tests (Postgres, ffmpeg)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: elearner
          POSTGRES_PASSWORD: elearner
          POSTGRES_DB: elearner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elearner" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install ffmpeg (worker transcode test runs it for real)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      # The Prisma client is gitignored and only turbo tasks generate it; seed and test:int bypass turbo.
      - run: pnpm db:generate
      - run: pnpm db:deploy # prisma migrate deploy: proves migrations apply cleanly from zero
      - run: pnpm --filter @elearner/web test:int
      - run: pnpm --filter @elearner/worker test:int

  e2e:
    name: Build + Playwright e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: elearner
          POSTGRES_PASSWORD: elearner
          POSTGRES_DB: elearner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elearner" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Don't set NODE_ENV here: `pnpm install` would skip devDependencies. playwright.config.ts starts the
      # server with NODE_ENV=production, APP_URL and AUTH_SIGNIN_LIMIT_PER_MIN.
      APP_URL: http://localhost:3100
      BETTER_AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      GOOGLE_CLIENT_ID: ci.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-only
      TOKEN_ENC_KEYS: v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TOKEN_ENC_ACTIVE_KEY_ID: v1
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: elearner-media
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci-only
      S3_FORCE_PATH_STYLE: "true"
      SMTP_URL: smtp://localhost:1025
      MAIL_FROM: E-learner CI <ci@example.com>
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Prisma client is gitignored and only turbo tasks generate it; seed and test:int bypass turbo.
      - run: pnpm db:generate
      - run: pnpm db:deploy
      # The seed refuses NODE_ENV=production on purpose; this database is a throwaway service container.
      - run: pnpm db:seed
        env:
          NODE_ENV: test
      - run: pnpm --filter @elearner/web build
      - name: Install Chromium for Playwright
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  static-site:
    name: Static landing site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same command Vercel runs (vercel.json); fails if the landing page stops being exportable.
      - run: pnpm build:site
      - name: Check the export
        run: |
          test -f apps/web/out/index.html
          test -f apps/web/out/enroll/index.html
          grep -q "Code Foundations" apps/web/out/index.html
          du -sh apps/web/out

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [web, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          tags: elearner-${{ matrix.app }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Smoke-test the image
        run: |
          if [ "${{ matrix.app }}" = worker ]; then
            docker run --rm elearner-worker:ci ffmpeg -hide_banner -version
            docker run --rm elearner-worker:ci node -e "require('node:fs').statSync('dist/index.js')"
          else
            docker run --rm elearner-web:ci node -e "require('node:fs').statSync('apps/web/server.js')"
          fi
          docker run --rm elearner-${{ matrix.app }}:ci id -u | grep -qv '^0$' # never runs as root
          docker image ls elearner-${{ matrix.app }}:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
