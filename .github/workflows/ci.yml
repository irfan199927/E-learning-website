# Quality gate for every PR, and for main via deploy.yml (which calls this before shipping, so pushes to
# main run it once, not twice). Required checks: checks, integration, e2e, docker.
# Same commands a contributor runs locally (see README "Scripts").
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  # Throwaway values for CI only: the apps validate their env, and the tests use local services.
  DATABASE_URL: postgresql://elearner:elearner@localhost:5432/elearner
  REDIS_URL: redis://localhost:6379

jobs:
  checks:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration tests (Postgres, ffmpeg)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: elearner
          POSTGRES_PASSWORD: elearner
          POSTGRES_DB: elearner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elearner" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install ffmpeg (worker transcode test runs it for real)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      # The Prisma client is gitignored and only turbo tasks generate it; seed and test:int bypass turbo.
      - run: pnpm db:generate
      - run: pnpm db:deploy # prisma migrate deploy: proves migrations apply cleanly from zero
      - run: pnpm --filter @elearner/web test:int
      - run: pnpm --filter @elearner/worker test:int

  e2e:
    name: Build + Playwright e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: elearner
          POSTGRES_PASSWORD: elearner
          POSTGRES_DB: elearner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elearner" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      # Catches the app's email; e2e reads invite links from its API (localhost:8025).
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
    env:
      # Don't set NODE_ENV here: `pnpm install` would skip devDependencies. playwright.config.ts starts the
      # server with NODE_ENV=production, APP_URL and AUTH_SIGNIN_LIMIT_PER_MIN.
      APP_URL: http://localhost:3100
      BETTER_AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      GOOGLE_CLIENT_ID: ci.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-only
      TOKEN_ENC_KEYS: v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TOKEN_ENC_ACTIVE_KEY_ID: v1
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: elearner-media
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci-only-secret
      S3_FORCE_PATH_STYLE: "true"
      SMTP_URL: smtp://localhost:1025
      MAIL_FROM: E-learner CI <ci@example.com>
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lesson attachments upload to and download from real storage. MinIO needs a command (`server /data`),
      # which service containers can't set, so it runs here. Same image as docker-compose.yml.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=ci -e MINIO_ROOT_PASSWORD=ci-only-secret \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 30); do
            docker exec minio mc alias set local http://localhost:9000 ci ci-only-secret && break
            sleep 1
          done
          docker exec minio mc mb --ignore-existing local/elearner-media
      # The Prisma client is gitignored and only turbo tasks generate it; seed and test:int bypass turbo.
      - run: pnpm db:generate
      - run: pnpm db:deploy
      # The seed refuses NODE_ENV=production on purpose; this database is a throwaway service container.
      - run: pnpm db:seed
        env:
          NODE_ENV: test
      - run: pnpm --filter @elearner/web build
      - name: Install Chromium for Playwright
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  static-site:
    name: Static landing site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same command Vercel runs (vercel.json); fails if the landing page stops being exportable.
      - run: pnpm build:site
      - name: Check the export
        run: |
          test -f apps/web/out/index.html
          test -f apps/web/out/enroll/index.html
          grep -q "Code Foundations" apps/web/out/index.html
          du -sh apps/web/out

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [web, worker]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          tags: elearner-${{ matrix.app }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Smoke-test the image
        run: |
          if [ "${{ matrix.app }}" = worker ]; then
            docker run --rm elearner-worker:ci ffmpeg -hide_banner -version
            docker run --rm elearner-worker:ci node -e "require('node:fs').statSync('dist/index.js')"
          else
            docker run --rm elearner-web:ci node -e "require('node:fs').statSync('apps/web/server.js')"
          fi
          docker run --rm elearner-${{ matrix.app }}:ci id -u | grep -qv '^0$' # never runs as root
          docker image ls elearner-${{ matrix.app }}:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
