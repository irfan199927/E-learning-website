# Production deploy: on every push to main (and on demand), after the full CI gate passes.
#   CI → [approval] migrate DB → deploy web (Vercel) + worker (image on GHCR → Render)
# Setup (once) and rollback: docs/deployment.md. Until the repo variable DEPLOY_ENABLED is "true",
# the deploy jobs are skipped, so main stays green before the hosting accounts exist.
# The worker job also needs WORKER_ENABLED="true" (skipped on the free-tier setup, which has no worker).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deploy at a time, and never cancel one half-way through a migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  migrate:
    name: Migrate database
    needs: ci
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Required reviewers on this environment are the approval gate (Settings → Environments).
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations must be backward compatible (expand → deploy → contract): the old app version keeps
      # serving until the new one is live. Use the DIRECT (non-pooled) Neon URL for migrations.
      - run: pnpm db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_DIRECT_URL }}

  web:
    name: Deploy web (Vercel)
    needs: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # Runtime env vars live in the Vercel project (docs/deployment.md); `pull` brings them in for the build.
      - run: pnpm dlx vercel@62.1.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx vercel@62.1.0 build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx vercel@62.1.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  worker:
    name: Deploy worker (GHCR → Render)
    needs: migrate
    # Off until a worker host exists (free-tier setup runs web only). Set the repo variable WORKER_ENABLED=true.
    if: vars.WORKER_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (GHCR needs lowercase)
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/worker:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      # Render's deploy hook for an image-backed service accepts the exact image to run.
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: curl -fsS -X POST --get "$RENDER_DEPLOY_HOOK_URL" --data-urlencode "imgURL=$IMAGE" > /dev/null
