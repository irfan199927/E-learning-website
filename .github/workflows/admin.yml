# One-off admin tasks against the production database, run by hand from GitHub → Actions.
# Uses the same `production` environment (and approval) as deploy.yml.
name: "Admin: set user role"

on:
  workflow_dispatch:
    inputs:
      email:
        description: Email of a user who has signed in at least once
        required: true
        type: string
      role:
        description: New role
        required: true
        type: choice
        options: [TEACHER, ADMIN, STUDENT, PARENT]

permissions:
  contents: read

jobs:
  set-role:
    name: Set role
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:set-role -- "$EMAIL" "$ROLE"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          EMAIL: ${{ inputs.email }}
          ROLE: ${{ inputs.role }}
