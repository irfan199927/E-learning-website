# One-off admin tasks against the production database, run by hand from GitHub → Actions.
# Uses the same `production` environment (and approval) as deploy.yml.
name: "Admin: set user role"

on:
  workflow_dispatch:
    inputs:
      email:
        description: Email of a user who has signed in at least once
        required: true
        type: string
      role:
        description: New role
        required: true
        type: choice
        options: [TEACHER, ADMIN, STUDENT, PARENT]

permissions:
  contents: read

jobs:
  set-role:
    name: Set role
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:set-role -- "$EMAIL" "$ROLE"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          EMAIL: ${{ inputs.email }}
          ROLE: ${{ inputs.role }}
