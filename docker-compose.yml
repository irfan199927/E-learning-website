# Local infrastructure only. Apps run on the host with `pnpm dev`.
name: elearner

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: elearner
      POSTGRES_PASSWORD: elearner
      POSTGRES_DB: elearner
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elearner"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  # S3-compatible stand-in for Cloudflare R2. MinIO stopped publishing minio/minio and minio/mc images,
  # so we use the community build from pgsty (same server, ships `mc` too). One image for both services.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: elearner
      MINIO_ROOT_PASSWORD: elearner-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 elearner elearner-secret; do sleep 1; done;
      mc mb --ignore-existing local/elearner-media;
      mc anonymous set none local/elearner-media;
      "

  # Catches all outgoing email. UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  redisdata:
  miniodata:
